name: CI

on:
  push:
    branches: [main, 'renovate/**']
  workflow_call:
    inputs:
      apt-packages:
        description: Space-separated Ubuntu packages the repo's build needs beyond the runner image, e.g. libasound2-dev for cpal
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      SKIP_ENV_VALIDATION: 1 # env.ts would demand runtime secrets CI never holds
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - if: inputs.apt-packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $PACKAGES
        env:
          PACKAGES: ${{ inputs.apt-packages }}
      - run: bun install --frozen-lockfile
      - run: bun run ci
