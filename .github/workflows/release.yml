name: Release

on:
  workflow_dispatch: # re-run a publish by hand if a release-triggered run failed
    inputs:
      dry-run:
        description: Run every step, but pack instead of publishing
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance — no token secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }} # the tagged commit, not the branch head; empty on dispatch -> the dispatched ref
      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # npm >= 11.5.1 required for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # npm publish runs `prepare`, which generates the shipped rule types
      - run: npm ${{ inputs.dry-run && 'pack --dry-run' || 'publish' }} # publish --dry-run still refuses the already-published pre-bump version
